[build]
  publish = "dist"
  command = "node scripts/complete-build.js"

# Enable prerendering for social media crawlers
[dev]
  command = "npm run dev"

# Blog post redirects for social media crawlers
# Facebook/Meta crawlers
[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200
  conditions = {User-Agent = "facebookexternalhit/*"}

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200
  conditions = {User-Agent = "Facebot/*"}

# Twitter/X crawlers
[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200
  conditions = {User-Agent = "Twitterbot/*"}

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200
  conditions = {User-Agent = "twitterbot/*"}

# LinkedIn crawlers
