
[build]
  command = "npm run build"
  publish = "dist"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Build environment
[build.environment]
  NETLIFY_SKIP_PNPM_INSTALL = "true"

# Headers for better caching and social media crawlers
[[headers]]
  for = "/blog/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=31536000, immutable"

# Social media crawler redirects to function for proper OG tags
[[redirects]]
  from = "/blog/:slug"
  to = "/.netlify/functions/blog-meta?slug=:slug"
  status = 200
  force = false
  conditions = {User-Agent = "facebookexternalhit*,LinkedInBot*,Twitterbot*,WhatsApp*,SkypeUriPreview*,SlackBot*,TelegramBot*,bingbot*,GoogleBot*"}

# SPA fallback for regular users
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
