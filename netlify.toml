[build]
  publish = "dist"
  command = "npm run build"

# Enable prerendering for social media crawlers
[dev]
  command = "npm run dev"

# Handle blog posts with crawler detection
[[redirects]]
  from = "/blog/:slug"
  to = "/.netlify/functions/blog-og-handler?slug=:slug"
  status = 200

# Redirect rules for SPA (catch-all)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Prerender settings for better social media crawler support
[build.environment]
  NETLIFY_PRERENDER_ENABLED = "true"

# Cache headers for images
[[headers]]
  for = "/og-*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    
[[headers]]
  for = "/lovable-uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"