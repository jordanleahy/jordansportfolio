[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200
  conditions = {User-Agent = "*spider*"}

# Google and other search engine crawlers
[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200
  conditions = {User-Agent = "Googlebot/*"}

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200
  conditions = {User-Agent = "Bingbot/*"}

# Fallback for any other crawlers
[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200
  conditions = {User-Agent = "*crawling*"}

# Regular users get the SPA (catch-all)
[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200

# Allow ACME challenges to return 404 naturally (for Let's Encrypt SSL)
[[redirects]]
  from = "/.well-known/acme-challenge/*"
  to = "/404.html"
  status = 404
  force = false

# Main SPA redirect rules for other routes (catch-all)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Prerender settings for better social media crawler support
[build.environment]
  NETLIFY_PRERENDER_ENABLED = "true"

# Cache headers for static blog OG files
[[headers]]
  for = "/blog/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=7200"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"

# Cache headers for images
[[headers]]
  for = "/og-*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    
[[headers]]
  for = "/lovable-uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"