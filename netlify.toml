[build]
  command = "npm run build"
  publish = "dist"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Enable prerendering for better social media sharing
[[plugins]]
  package = "@netlify/plugin-sitemap"

# Prerender blog routes for social media crawlers
[build.environment]
  NETLIFY_SKIP_PNPM_INSTALL = "true"

# Headers for better caching and social media crawlers
[[headers]]
  for = "/blog/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback - exclude prerendered routes
[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200
  force = false
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200